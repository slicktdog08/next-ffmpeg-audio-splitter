# Move this file to .github/workflows/ci.yml to enable CI (it was pushed by a token without the `workflow` scope).
name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    secrets:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: gitleaks
              run: |
                  curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
                  ./gitleaks git --redact --verbose .

    test:
        name: Typecheck, unit tests, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn typecheck
            - run: yarn test
            - run: yarn build

    e2e:
        name: E2E (Playwright)
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn
            - run: sudo apt-get update && sudo apt-get install -y ffmpeg
            - run: yarn install --frozen-lockfile
            - run: npx playwright install --with-deps chromium
            # No secrets: the config runs the app with local storage and the captcha skipped
            - run: yarn e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      e2e/.results/
                  retention-days: 7
